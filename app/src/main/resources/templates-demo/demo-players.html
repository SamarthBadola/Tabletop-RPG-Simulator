<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head><meta charset="utf-8"><title>Players and invites</title></head>
<body><main>
    <h1>Players and invites</h1>
    <p>Join address: <span th:text="${joinAddress}"></span></p>
    <svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" role="img"
         aria-label="QR code for the join address" th:attr="viewBox=${qr.viewBox}">
        <rect width="100%" height="100%" fill="white"/>
        <path th:attr="d=${qr.path}" fill="black"/>
    </svg>
    <p th:if="${localAddress}">Other devices cannot reach this address. Open the campaign using the host's LAN address.</p>
    <ul>
        <li th:each="member : ${members}">
            <span th:text="${member.username}"></span>
            <span th:text="${member.role}"></span>
            <time th:text="${member.joinedAt}"></time>
        </li>
    </ul>
    <section id="invites" th:fragment="invites">
        <h2>Invites</h2>
        <p th:if="${inviteCode != null}">New code: <strong id="new-invite-code" th:text="${inviteCode}"></strong></p>
        <p th:if="${shownOnce}">The code was shown once. Create a new invite if you need another code.</p>
        <p th:if="${invites.isEmpty()}">No invites yet.</p>
        <ul>
            <li th:each="invite : ${invites}" th:attr="data-invite-id=${invite.id}">
                <span th:text="${invite.state}"></span>
                <span th:text="|${invite.usesLeft} uses left|"></span>
                <time th:text="${invite.createdAt}"></time>
                <time th:text="${invite.expiresAt}"></time>
                <form th:if="${invite.state != 'revoked'}"
                      th:action="@{/campaigns/{id}/invites/{invite}/revocations(id=${campaign.id},invite=${invite.id})}"
                      method="post">
                    <div th:replace="~{demo-command :: envelope}"></div>
                    <button type="submit">Revoke invite</button>
                </form>
            </li>
        </ul>
        <form th:action="@{/campaigns/{id}/invites(id=${campaign.id})}" method="post">
            <input type="hidden" name="formToken" th:value="${formToken}">
            <label for="maxUses">Uses</label>
            <input id="maxUses" name="maxUses" type="number" min="1" max="20" value="1">
            <label for="expiresInDays">Expires after (days)</label>
            <input id="expiresInDays" name="expiresInDays" type="number" min="1" max="30" value="7">
            <button type="submit">Create invite</button>
        </form>
    </section>
    <a th:href="@{/campaigns/{id}(id=${campaign.id})}">Open campaign</a>
</main><footer th:replace="~{demo-footer :: help}"></footer>
</body>
</html>
