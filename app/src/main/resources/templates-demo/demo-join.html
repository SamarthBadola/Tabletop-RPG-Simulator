<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head><meta charset="utf-8"><title>Join a campaign</title></head>
<body><main>
    <h1>Join a campaign</h1>
    <form th:action="@{/join}" method="post">
        <input type="hidden" name="formToken" th:value="${formToken}">
        <label for="inviteCode">Invite code</label>
        <input id="inviteCode" name="inviteCode" maxlength="10" autocomplete="off" required>
        <button type="submit">Join campaign</button>
    </form>
</main></body>
</html>
