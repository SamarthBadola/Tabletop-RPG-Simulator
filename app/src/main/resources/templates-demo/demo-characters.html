<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head><meta charset="utf-8"><title>Characters</title></head>
<body><main>
    <a th:href="@{/campaigns/{id}(id=${campaign.id})}">Campaign</a>
    <h1 th:text="${dm ? 'Party' : 'My characters'}">Characters</h1>
    <a th:href="@{/campaigns/{id}/characters/new(id=${campaign.id})}">Create character</a>
    <p th:if="${characters.isEmpty()}">No characters yet.</p>
    <table th:unless="${characters.isEmpty()}">
        <thead><tr><th>Name</th><th>Species</th><th>Class</th><th>Hit points</th><th th:if="${dm}">Armor class</th></tr></thead>
        <tbody><tr th:each="character : ${characters}">
            <td><a th:href="@{/campaigns/{id}/characters/{pc}(id=${campaign.id},pc=${character.id})}"
                   th:text="${character.name}">Character</a></td>
            <td th:text="${character.species}"></td>
            <td><span th:each="entry : ${character.classes}" th:text="|${entry.name} ${entry.level}|"></span></td>
            <td th:text="|${character.currentHp} / ${character.maximumHp}|"></td>
            <td th:if="${dm}" th:text="${character.armorClass}"></td>
        </tr></tbody>
    </table>
</main><footer th:replace="~{demo-footer :: help}"></footer></body></html>
