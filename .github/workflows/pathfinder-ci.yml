name: Pathfinder CI

on:
  pull_request:
    paths:
      - pathfinder/**
      - .github/workflows/pathfinder-ci.yml
  push:
    branches: [main]
    paths:
      - pathfinder/**
      - .github/workflows/pathfinder-ci.yml

permissions:
  contents: read

concurrency:
  group: pathfinder-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pathfinder:
    name: pathfinder (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            build_type: Release
            flags: ""
          - name: asan-ubsan
            build_type: Debug
            flags: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer
          - name: tsan
            build_type: Debug
            flags: -fsanitize=thread
    defaults:
      run:
        working-directory: pathfinder
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Let ThreadSanitizer start on this runner
        if: matrix.name == 'tsan'
        # Recent kernels randomise memory addresses more than ThreadSanitizer can handle.
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
          SANITIZER_FLAGS: ${{ matrix.flags }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DCMAKE_CXX_FLAGS="$SANITIZER_FLAGS -Werror"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure

      - name: Check the running HTTP service
        run: python3 test/test_http.py build/pathfinder_server

      - name: Benchmark the worst requests
        if: matrix.name == 'release'
        # A loose limit (the service itself stops a search after 200 ms): it catches a real
        # slowdown without failing on a slow runner.
        run: ./build/pathfinder_bench --max-ms 100

      - name: Smoke-test the running service and its clean shutdown
        if: matrix.name == 'release'
        shell: bash
        env:
          PORT: "19000"
          WORKERS: "2"
        run: |
          set -euo pipefail
          ./build/pathfinder_server > server.log 2>&1 &
          pid=$!
          trap 'kill -TERM "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            curl -fsS "http://127.0.0.1:${PORT}/healthz" > /dev/null 2>&1 && break
            sleep 0.1
          done
          curl -fsS "http://127.0.0.1:${PORT}/healthz"
          echo
          curl -fsS -H 'Content-Type: application/json' \
            -d '{"width":5,"height":2,"cells":["12111","11111"],"start":[0,0],"goal":[4,0],"budget":600}' \
            "http://127.0.0.1:${PORT}/v1/path" | tee path.json
          echo
          grep -Fq '"found":true' path.json
          ./build/pathfinder_server --healthcheck
          kill -TERM "$pid"
          wait "$pid"   # a clean shutdown exits with 0, which "set -e" requires
          grep -Fq '"event":"service.stopped"' server.log

      - name: Show the service log after a failure
        if: failure() && matrix.name == 'release'
        run: cat server.log || true
