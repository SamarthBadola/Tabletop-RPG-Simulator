name: CI

on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check patch whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "${BASE_SHA}...${HEAD_SHA}"
          elif [[ ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git show --check --format= "$HEAD_SHA"
          fi

      - name: Verify project context and policy files exist
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s LICENSE
          test -s NOTICE
          test -s CONTRIBUTING.md
          test -s SECURITY.md
          test -s .github/CODEOWNERS
          test -s .github/dco.yml
          test -s app/pom.xml
          test -s app/mvnw
          test -s app/.mvn/wrapper/maven-wrapper.properties
          test -s app/Dockerfile
          test -s deploy/docker-compose.yml
          test -s deploy/docker-compose.build.yml
          test -s deploy/.env.example
          test -s deploy/scripts/init-env.sh
          test -s deploy/scripts/smoke.py
          grep -Fq 'This work includes material taken from the System Reference Document 5.1 (“SRD 5.1”) by Wizards of the Coast LLC and available at https://dnd.wizards.com/resources/systems-reference-document. The SRD 5.1 is licensed under the Creative Commons Attribution 4.0 International License available at https://creativecommons.org/licenses/by/4.0/legalcode.' README.md
          test -s docs/architecture.md
          test -s 'docs/Tabletop RPG Simulator AI Build Brief.md'
          test -s docs/DECISION-LOG.md
          test -s docs/PROGRESS.md
          test -s docs/AI-HANDOFF.md
          test -s docs/REPOSITORY-GOVERNANCE.md

      - name: Validate Dependabot labels and Java 25 baseline
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            dependabot = YAML.safe_load_file(".github/dependabot.yml", aliases: false)
            manifest = YAML.safe_load_file(".github/labels.yml", aliases: false)
            labels = manifest.fetch("labels")
            names = labels.map { |label| label.fetch("name") }
            abort "Duplicate names in .github/labels.yml" unless names.uniq == names

            labels.each do |label|
              color = label.fetch("color")
              abort "Invalid color for label #{label.fetch("name")}" unless color.match?(/\A[0-9a-fA-F]{6}\z/)
              description = label.fetch("description")
              abort "Missing description for label #{label.fetch("name")}" unless description.is_a?(String) && !description.strip.empty?
            end

            referenced = dependabot.fetch("updates").flat_map { |update| Array(update["labels"]) }.uniq
            missing = referenced - names
            abort "Dependabot labels missing from .github/labels.yml: #{missing.join(", ")}" unless missing.empty?
            puts "Dependabot labels match .github/labels.yml."
          '

          grep -Fq '<java.version>25</java.version>' app/pom.xml
          grep -Eq '^FROM eclipse-temurin:25\.[^[:space:]]+-jdk-noble AS build$' app/Dockerfile
          grep -Eq '^FROM eclipse-temurin:25\.[^[:space:]]+-jre-noble$' app/Dockerfile
          echo "Maven and Docker runtime baselines remain on Java 25."

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: app/pom.xml

      - name: Check formatting and run unit tests
        working-directory: app
        run: ./mvnw -B -ntp spotless:check test

  integration:
    name: integration
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: app/pom.xml

      - name: Run PostgreSQL integration tests
        working-directory: app
        run: ./mvnw -B -ntp verify -Pintegration

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-smoke:
    needs: [integration]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise local configuration
        run: ./deploy/scripts/init-env.sh

      - name: Build and start the stack
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml --env-file deploy/.env up --build -d

      - name: Verify readiness, bootstrap registration and login
        run: python3 deploy/scripts/smoke.py http://localhost:8080

      - name: Show service logs after a failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml --env-file deploy/.env logs

      - name: Stop stack and remove CI database
        if: always()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml --env-file deploy/.env down -v
