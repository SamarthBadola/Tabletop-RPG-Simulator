name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: repo-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check patch whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/check-patch-whitespace.sh

      - name: Test patch whitespace history fallbacks
        run: bash .github/scripts/test-check-patch-whitespace.sh

      - name: Verify project context and policy files exist
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s LICENSE
          test -s NOTICE
          test -s CONTRIBUTING.md
          test -s SECURITY.md
          test -s .github/CODEOWNERS
          test -s .github/dco.yml
          test -s .github/scripts/check-patch-whitespace.sh
          test -s .github/scripts/test-check-patch-whitespace.sh
          test -s app/pom.xml
          test -s app/mvnw
          test -s app/.mvn/wrapper/maven-wrapper.properties
          test -s app/Dockerfile
          test -s deploy/docker-compose.yml
          test -s deploy/docker-compose.build.yml
          test -s deploy/.env.example
          test -s deploy/scripts/init-env.sh
          test -s deploy/scripts/smoke.py
          grep -Fq 'This work includes material taken from the System Reference Document 5.1 (“SRD 5.1”) by Wizards of the Coast LLC and available at https://dnd.wizards.com/resources/systems-reference-document. The SRD 5.1 is licensed under the Creative Commons Attribution 4.0 International License available at https://creativecommons.org/licenses/by/4.0/legalcode.' README.md
          test -s docs/architecture.md
          test -s 'docs/Tabletop RPG Simulator AI Build Brief.md'
          test -s docs/DECISION-LOG.md
          test -s docs/PROGRESS.md
          test -s docs/AI-HANDOFF.md
          test -s docs/REPOSITORY-GOVERNANCE.md

      - name: Validate workflow YAML and immutable action references
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            workflow_paths = Dir.glob(".github/workflows/*.{yml,yaml}").sort
            abort "No GitHub Actions workflow files found." if workflow_paths.empty?

            workflow_paths.each do |path|
              workflow = YAML.safe_load_file(path, aliases: false)
              abort "Workflow root must be a mapping: #{path}" unless workflow.is_a?(Hash)
              abort "Workflow trigger section is missing: #{path}" unless workflow.key?("on") || workflow.key?(true)
              abort "Workflow jobs section must be a non-empty mapping: #{path}" unless workflow["jobs"].is_a?(Hash) && !workflow["jobs"].empty?

              visit = lambda do |node|
                case node
                when Hash
                  node.each do |key, value|
                    if key.to_s == "uses"
                      abort "Invalid uses reference in #{path}: #{value.inspect}" unless value.is_a?(String)

                      if value.start_with?("./")
                        next
                      elsif value.start_with?("docker://")
                        abort "Docker action must be pinned by SHA-256 digest in #{path}: #{value}" unless value.match?(/@sha256:[0-9a-f]{64}\z/i)
                      else
                        reference = value.split("@", 2)[1]
                        abort "External action must be pinned to a full 40-character commit SHA in #{path}: #{value}" unless reference&.match?(/\A[0-9a-f]{40}\z/i)
                      end
                    end
                    visit.call(value)
                  end
                when Array
                  node.each { |value| visit.call(value) }
                end
              end

              visit.call(workflow)
              puts "Validated workflow syntax and action pins: #{path}"
            end
          '

      - name: Validate Dependabot labels and Java 25 baseline
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            dependabot = YAML.safe_load_file(".github/dependabot.yml", aliases: false)
            manifest = YAML.safe_load_file(".github/labels.yml", aliases: false)
            labels = manifest.fetch("labels")
            names = labels.map { |label| label.fetch("name") }
            abort "Duplicate names in .github/labels.yml" unless names.uniq == names

            labels.each do |label|
              color = label.fetch("color")
              abort "Invalid color for label #{label.fetch("name")}" unless color.match?(/\A[0-9a-fA-F]{6}\z/)
              description = label.fetch("description")
              abort "Missing description for label #{label.fetch("name")}" unless description.is_a?(String) && !description.strip.empty?
            end

            referenced = dependabot.fetch("updates").flat_map { |update| Array(update["labels"]) }.uniq
            missing = referenced - names
            abort "Dependabot labels missing from .github/labels.yml: #{missing.join(", ")}" unless missing.empty?
            puts "Dependabot labels match .github/labels.yml."
          '

          grep -Fq '<java.version>25</java.version>' app/pom.xml
          grep -Eq '^FROM eclipse-temurin:25\.[^[:space:]]+-jdk-noble AS build$' app/Dockerfile
          grep -Eq '^FROM eclipse-temurin:25\.[^[:space:]]+-jre-noble$' app/Dockerfile
          echo "Maven and Docker runtime baselines remain on Java 25."

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: app/pom.xml

      - name: Check formatting and run unit tests
        working-directory: app
        run: |
          bash scripts/check-engine-strict.sh
          ./mvnw -B -ntp spotless:check test forbiddenapis:check forbiddenapis:testCheck
          ./mvnw -B -ntp test forbiddenapis:testCheck -DargLine="-Duser.language=tr -Duser.country=TR -Duser.timezone=Pacific/Kiritimati -Ddice.localeJob=true"

  integration:
    name: integration
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: app/pom.xml

      - name: Run PostgreSQL integration tests
        working-directory: app
        run: ./mvnw -B -ntp verify -Pintegration

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-smoke:
    needs: [integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise local configuration
        run: ./deploy/scripts/init-env.sh

      - name: Build and start the stack
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml --env-file deploy/.env up --build -d

      - name: Verify readiness, bootstrap registration and login
        run: python3 deploy/scripts/smoke.py http://localhost:8080

      - name: Show service logs after a failure
        if: failure()
        shell: bash
        run: |
          if [[ -f deploy/.env ]]; then
            docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml --env-file deploy/.env logs --no-color || true
          else
            echo "::notice::Skipping service logs because deploy/.env was not created."
          fi

      - name: Stop stack and remove CI database
        if: always()
        shell: bash
        run: |
          if [[ -f deploy/.env ]]; then
            if ! docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml --env-file deploy/.env down -v --remove-orphans --timeout 30; then
              echo "::warning::Compose cleanup failed; the ephemeral runner will be discarded."
            fi
          else
            echo "::notice::Skipping Compose cleanup because deploy/.env was not created."
          fi
