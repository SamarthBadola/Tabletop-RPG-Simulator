name: Pathfinder image

# Builds the pathfinder container image for both common CPU types (amd64 and arm64).
# It only builds: nothing is pushed to a registry. The Dockerfile compiles the code and runs
# every test, so a green run also means the tests pass inside the image on both CPU types.

on:
  pull_request:
    paths:
      - pathfinder/**
      - .github/workflows/pathfinder-image.yml
  push:
    branches:
      - main
    paths:
      - pathfinder/**
      - .github/workflows/pathfinder-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pathfinder-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60  # the arm64 build runs under emulation, which is slow
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up emulation for arm64
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image for both platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: pathfinder
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            PATHFINDER_BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
