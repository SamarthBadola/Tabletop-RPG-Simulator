name: Pathfinder image

# Build, smoke-test and scan each supported platform without publishing an image.

on:
  pull_request:
    paths:
      - pathfinder/**
      - .github/workflows/pathfinder-image.yml
  push:
    branches:
      - main
    paths:
      - pathfinder/**
      - .github/workflows/pathfinder-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pathfinder-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: pathfinder image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 60  # the arm64 build runs under emulation
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      IMAGE: rpg-pathfinder:${{ github.sha }}-${{ matrix.arch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up emulation for arm64
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: pathfinder
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            PATHFINDER_BUILD=${{ github.sha }}
          cache-from: type=gha,scope=pathfinder-${{ matrix.arch }}
          cache-to: type=gha,scope=pathfinder-${{ matrix.arch }},mode=max

      - name: Check the runtime image
        run: |
          set -euo pipefail
          container=$(docker run -d --read-only --cap-drop=ALL --platform linux/${{ matrix.arch }} "$IMAGE")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for _ in $(seq 1 30); do
            if docker exec "$container" /usr/local/bin/pathfinder_server --healthcheck; then
              exit 0
            fi
            sleep 0.2
          done
          docker logs "$container"
          exit 1

      - name: Scan the runtime image for fixable high and critical vulnerabilities
        run: |
          set -euo pipefail
          docker save -o "$RUNNER_TEMP/pathfinder-image.tar" "$IMAGE"
          docker run --rm --volume "$RUNNER_TEMP/pathfinder-image.tar:/input/image.tar:ro" \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --input /input/image.tar --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 | tee "$RUNNER_TEMP/pathfinder-scan.txt"

      - name: Upload the image scan
        if: always() && hashFiles('pathfinder/Dockerfile') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pathfinder-scan-${{ matrix.arch }}
          path: ${{ runner.temp }}/pathfinder-scan.txt
          if-no-files-found: ignore
